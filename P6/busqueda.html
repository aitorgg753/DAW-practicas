<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Buscador</title>
        <meta charset="utf-8">
        <link rel = "stylesheet" href = "css/global.css">
        <link rel = "stylesheet" href = "css/busqueda.css">

        <link rel="alternate stylesheet" type="text/css" href="css/noche.css" title="Modo noche" media="screen" />
        <link rel="alternate stylesheet" type="text/css" href="css/grande.css" title="Texto grande" media="screen" />
        <link rel="alternate stylesheet" type="text/css" href="css/contraste.css" title="Alto contraste" media="screen"/>
        <link rel="alternate stylesheet" type="text/css" href="css/contrasteGrande.css" title="Alto contraste y texto grande" media="screen"/>
        <link rel="stylesheet" type="text/css" href="css/impresion.css" media="print"/>
        <script src = "js/tabla.js"></script>
    </head>

    <body>
        <header>
            <div id = "imgTit">
                <img src="img/Logo.svg" alt="Logo" width="100">
                <h1>PI - Pisos & Inmuebles</h1>
            </div>
            <nav>
                <ul>
                    <li><a href = "indexSesionIni.html">Inicio</a></li>
                    <li><a href="busqueda.html">Buscar</a></li>
                    <li><a id = "btnIniSes" href = "error.html">Iniciar sesión</a></li>
                    <li><a href="registro.html">Registarse</a>    
                </ul>
            </nav>
        </header>
        <main>
            <form action="listado.html" class="tarjeta" id="formBusqueda">
                <h2>Buscar vivienda</h2>

                <label for = "anuncio">Tipo de anuncio</label>
                <select id = "anuncio" class="borde">
                    <option>Venta</option>
                    <option>Alquiler</option>
                </select>
                
                <label for = "vivienda">Tipo de vivienda</label>
                <select id = "vivienda" class="borde">
                    <option>Obra nueva</option>
                    <option>Vivienda</option>
                    <option>Oficina</option>
                    <option>Local</option>
                    <option>Garaje</option>
                </select>

                <label for = "ciudad">Ciudad</label>
                <input type="text" id = "ciudad" placeholder="Alicante" class="borde">

                <label for = "pais">País</label>
                <select id = "pais" class="borde">
                    <option>España</option>
                    <option>Moldavia</option>
                    <option>Alemania</option>
                    <option>Yemen</option>
                    <option>Francia</option>
                </select>

                <label for = "fecha">Fecha de publicación</label>
                <input type = "date" id = "fecha" class="borde">

                <div id = "filtroPrecio">
                    <label for="desde">Desde</label>
                    <input type="number" id = "desde" class="borde">
                    <label for = "hasta">hasta</label>
                    <input type="number" id = "hasta" class="borde">
                </div>

                <button type="submit">Buscar</button>
            </form>
        </main>
        <footer>
            <p>© 2026 PI - Pisos &amp; Inmuebles | <a href="accesibilidad.html">Accesibilidad</a></p>
        </footer>
    </body>
</html>
