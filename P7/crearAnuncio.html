<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de nuevo usuario - PI Pisos e Inmuebles</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/registro.css">

    <link rel="alternate stylesheet" type="text/css" href="css/noche.css" title="Modo noche" media="screen" />
    <link rel="alternate stylesheet" type="text/css" href="css/grande.css" title="Texto grande" media="screen" />
    <link rel="alternate stylesheet" type="text/css" href="css/contraste.css" title="Alto contraste" media="screen"/>
    <link rel="alternate stylesheet" type="text/css" href="css/contrasteGrande.css" title="Alto contraste y texto grande" media="screen"/>
    <link rel="stylesheet" type="text/css" href="css/impresion.css" media="print"/>
</head>

<body>
    <header>
        <div id="imgTit">
            <img src="img/Logo.svg" alt="Logo" width="100">
            <h1>PI - Pisos &amp; Inmuebles</h1>
        </div>
        <nav>
            <ul>
                <li><a href="indexSesionIni.html">Inicio</a></li>
                <li><a href="busqueda.html">Buscar</a></li>
                <li><a href="error.html">Iniciar sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2 style = "text-align: center; margin-bottom: 20px;">Crear anuncio</h2>

            <form action="" method="post">

                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej. Piso en Algeciras">

                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Piso de 3 habitaciones, 2 baños, cocina equipada...">

                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ej. Algeciras">

                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" placeholder="Ej. España">

                <label for="precio">Precio:</label>
                <input type="number" id="precio" name="precio" placeholder="Ej. 150000 €">

                <button type="submit">Crear anuncio</button>
                <button type="reset">Borrar datos</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 PI - Pisos &amp; Inmuebles | <a href="accesibilidad.html">Accesibilidad</a></p>
    </footer>
</body>
</html>
