<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de nuevo usuario - PI Pisos e Inmuebles</title>
</head>

<body>
    <header>
        <img src="Logo.svg" alt="Logo" width="100">
        <h1>PI - Pisos e Inmuebles</h1>
        <nav>
            <ul>
                <li><a href="indexSinSesion.html">Inicio</a></li>
                <li><a href="busqueda.html">Búsqueda de anuncio</a></li>
                <li><a href="error.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulario de registro</h2>
            <p>Todos los campos son obligatorios, no te olvides de rellenarlos</p>

            <form action="" method="post">

                <!-- Nombre de usuario -->
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="nombre"
                       pattern="[A-Za-z][A-Za-z0-9]{2,14}"
                       minlength="3" maxlength="15"
                       title="Debe empezar por una letra, solo letras (a-z, A-Z) y números, entre 3 y 15 caracteres"
                       required>

                <!-- Contraseña -->
                <label for="password">Contraseña: </label>
                <input type="password" id="password" name="password"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z0-9_-]{6,15}"
                       minlength="6" maxlength="15"
                       title="Entre 6 y 15 caracteres, al menos una mayúscula, una minúscula y un número. Se permiten letras, números, guion y guion bajo"
                       required>

                <!-- Repetir contraseña -->
                <label for="repetir_password">Repetir contraseña:</label>
                <input type="password" id="repetir_password" name="repetir_password"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z0-9_-]{6,15}"
                       minlength="6" maxlength="15"
                       title="Debe coincidir con la contraseña introducida"
                       required>

                <!-- Email -->
                <label for="email">Dirección de email:</label>
                <input type="email" id="email" name="email"
                       pattern="[A-Za-z0-9!#$%&'*+/=?^_`{|}~.-]{1,64}@[A-Za-z0-9](-?[A-Za-z0-9])*(\.[A-Za-z0-9](-?[A-Za-z0-9])*)+"
                       maxlength="254"
                       title=""
                       required>

                <!-- Sexo (desplegable) -->
                <label for="sexo">Sexo:</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="otro">Otro</option>
                </select>

                <!-- Fecha de nacimiento -->
                <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

                <!-- Ciudad de residencia -->
                <label for="ciudad">Ciudad de residencia:</label>
                <input type="text" id="ciudad" name="ciudad" required>

                <!-- País de residencia -->
                <label for="pais">País de residencia:</label>
                <input type="text" id="pais" name="pais" required>

                <!-- Foto de perfil -->
                <label for="foto">Foto de perfil:</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>

                <!-- Botones de envío -->
                <button type="submit">Enviar registro</button>
                <button type="reset">Borrar formulario</button>

            </form>
        </section>
    </main>
</body>
</html>
